services:

    jaeger:
        image: jaegertracing/all-in-one:1.56
        environment:
        - COLLECTOR_ZIPKIN_HOST_PORT=:9411
        - JAEGER_DISABLED=true 
        ports:
        - "16686:16686"  # UI port
        - "4318:4318"    # OTLP HTTP receiver port
        networks:
        - app-network
    db:
        image: postgres:latest
        env_file: .env
        ports:
            - "5432:5432"
        environment:
            POSTGRES_PASSWORD: ${PG_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - db_network

volumes:
    pgdata:

networks:
    app-network:
        driver: bridge
    db_network:
        driver: bridge
